services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?Configure DB_NAME no .env}
      POSTGRES_USER: ${DB_USERNAME:?Configure DB_USERNAME no .env}
      POSTGRES_PASSWORD: ${DB_PASS:?Configure DB_PASS no .env}
    volumes:
      - dairy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    env_file: .env
    volumes:
      - .:/code
      - static_volume:/code/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:latest
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - static_volume:/static:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
  dairy_postgres_data:
  static_volume:
